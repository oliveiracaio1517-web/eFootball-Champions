<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Entrar | eFootball Champions</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050811;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .logo span {
      color: #08d5f5;
    }

    .card {
      background: #0b1222;
      border: 1px solid #1c2942;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aeb9cc;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #dce5f5;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 14px;
      border: 1px solid #263653;
      background: #070d1b;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #08d5f5;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 17px;
      background: #08d5f5;
      color: #041018;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .button:active {
      transform: scale(.98);
    }

    .links {
      text-align: center;
      margin-top: 24px;
    }

    .links a {
      display: block;
      color: #08d5f5;
      text-decoration: none;
      margin: 14px 0;
    }

    .back {
      color: #aeb9cc !important;
    }

    .notice {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #102238;
      color: #b9c9dd;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      eFootball <span>Champions</span>
    </div>

    <div class="card">

      <h1>👋 Bem-vindo!</h1>

      <p class="subtitle">
        Entre na sua conta para acompanhar seus campeonatos,
        partidas e resultados.
      </p>

      <form onsubmit="entrar(event)">

        <label for="email">E-mail</label>

        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          required
        >

        <label for="senha">Senha</label>

        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
          required
        >

        <button class="button" type="submit">
          🚀 Entrar
        </button>

      </form>

      <div id="notice" class="notice">
        Sistema de login será conectado na próxima etapa.
      </div>

      <div class="links">

        <a href="#">
          🔑 Esqueci minha senha
        </a>

        <a href="cadastro.html">
          📝 Criar minha conta
        </a>

        <a class="back" href="index.html">
          ← Voltar para o início
        </a>

      </div>

    </div>

  </div>

  <script>
    function entrar(event) {
      event.preventDefault();

      document.getElementById("notice").style.display = "block";
    }
  </script>

</body>
</html>
